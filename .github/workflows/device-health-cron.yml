name: Device health cron

# Vercel's Hobby plan only allows a once-daily cron in vercel.json, but the
# device-health check needs to run every 5 minutes to keep offline detection
# meaningful (see src/app/api/cron/device-health/route.ts). This workflow is
# the real schedule; the vercel.json cron is just a once-a-day fallback in
# case this workflow ever stops firing.
#
# Requires a repo secret named CRON_SECRET matching the Vercel project's
# CRON_SECRET env var. Without it this workflow runs but every call gets a
# 401 from the endpoint.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call device-health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://wearealive.in/api/cron/device-health)
          echo "Response status: $status"
          if [ "$status" -ge 400 ]; then
            echo "device-health cron call failed with status $status"
            exit 1
          fi
